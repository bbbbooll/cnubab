<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우리는 회식 맛집이 필요해</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #ffffff;
      --surface: #ffffff;
      --soft: #f7f8fa;
      --ink: #111111;
      --muted: #666666;
      --line: #222222;
      --line-soft: #d9dce2;
      --danger: #c62828;
      --danger-soft: #fff5f5;
      --radius-card: 16px;
      --radius-sm: 10px;
      --header-h: 92px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.45;
    }

    button, input, select {
      font-family: inherit;
      color: var(--ink);
    }

    button {
      background: var(--surface);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius-sm);
      padding: 7px 12px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.14s ease, transform 0.12s ease, opacity 0.14s ease;
    }

    button:hover:not(:disabled) { background: var(--soft); }
    button:active:not(:disabled) { transform: scale(0.98); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    button.primary {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    button.danger {
      background: var(--danger-soft);
      color: var(--danger);
      border-color: #f3c6c6;
    }

    button.sm {
      padding: 5px 9px;
      font-size: 0.78rem;
      border-radius: 8px;
    }

    /* 최상단 고정 헤더 & 명조체 타이틀(우, 회, 해 볼드) */
    .top-header {
      border-bottom: 1px solid var(--line);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .header-wrap {
      max-width: 1440px;
      margin: 0 auto;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .site-title {
      margin: 0;
      font-family: "Noto Serif KR", "Batang", "바탕", Georgia, serif;
      font-size: 1.78rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      white-space: nowrap;
      cursor: pointer;
    }

    .site-title .bold-char {
      font-weight: 700;
    }

    .quick-filters {
      flex: 1 1 540px;
      display: grid;
      gap: 4px;
      border-left: 1px solid #9aa0a6;
      padding-left: 16px;
      max-width: 820px;
    }

    .quick-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      font-size: 0.88rem;
    }

    .quick-label {
      min-width: 68px;
      font-weight: 600;
      color: var(--ink);
      padding: 2px 8px 2px 0;
      border-right: 1px solid #b0b5bc;
      margin-right: 6px;
    }

    .quick-item {
      padding: 2px 10px;
      border-right: 1px solid #c5cad2;
      cursor: pointer;
      user-select: none;
      background: transparent;
      border-top: none;
      border-bottom: none;
      border-left: none;
      border-radius: 0;
      font-size: 0.88rem;
      font-weight: 400;
      transform: none;
    }

    .quick-item:active { transform: none; }
    .quick-item:last-child { border-right: none; }
    .quick-item:hover { background: #f2f4f8; }
    .quick-item.active {
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 4px;
      background: #eef2ff;
    }

    .header-utils {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nick-badge {
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.8rem;
      background: var(--soft);
    }

    /* 메인 레이아웃 */
    .main-shell {
      max-width: 1440px;
      margin: 0 auto;
      padding: 18px 24px 48px;
      display: flex;
      align-items: flex-start;
      gap: 18px;
    }

    .hamburger-btn {
      width: 40px;
      height: 40px;
      padding: 0;
      border: none;
      background: transparent;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .hamburger-btn:hover { background: var(--soft); }

    .hamburger-btn span {
      display: block;
      width: 22px;
      height: 1.8px;
      background: #333333;
    }

    .content-area {
      flex: 1;
      min-width: 0;
    }

    .toolbar-sub {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }

    .active-filter-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .active-tag {
      background: var(--ink);
      color: #fff;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.76rem;
      cursor: pointer;
    }

    /* 카드 그리드 */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(235px, 1fr));
      gap: 18px;
    }

    .add-tile {
      min-height: 310px;
      border: 1.5px solid #222222;
      border-radius: var(--radius-card);
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.2rem;
      font-weight: 300;
      color: #222222;
      cursor: pointer;
      transition: background-color 0.16s ease, transform 0.16s ease;
    }

    .add-tile:hover {
      background: #fafafa;
      transform: translateY(-2px);
    }

    .restaurant-card {
      border: 1.5px solid #222222;
      border-radius: var(--radius-card);
      background: #ffffff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }

    .restaurant-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.07);
    }

    .card-thumb {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #ffffff;
      border-bottom: 1px solid #222222;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-thumb .placeholder-text {
      color: #333333;
      font-size: 1rem;
    }

    .photo-count-pill {
      position: absolute;
      right: 8px;
      bottom: 8px;
      background: rgba(17, 17, 17, 0.72);
      color: #fff;
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: 999px;
    }

    .card-info {
      padding: 12px 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card-name {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .card-summary {
      font-size: 0.9rem;
      color: #222222;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-like-row {
      margin-top: 4px;
      font-size: 0.92rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 상단 경계 고정 + 부드러운 슬라이드 드로어 */
    .drawer-backdrop {
      position: fixed;
      top: var(--header-h);
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 25;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.22s ease, visibility 0.22s ease;
    }

    .drawer-backdrop.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .drawer-panel {
      width: 340px;
      max-width: 88vw;
      height: 100%;
      background: #ffffff;
      border-right: 1.5px solid #222222;
      padding: 20px 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
      transform: translateX(-100%);
      transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .drawer-backdrop.open .drawer-panel {
      transform: translateX(0);
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--line-soft);
      padding-bottom: 10px;
    }

    .drawer-header h2 {
      margin: 0;
      font-size: 1.05rem;
    }

    .drawer-group-title {
      font-size: 0.88rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .drawer-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .filter-chip {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid #c5cad2;
      background: #fff;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.14s ease, color 0.14s ease, border-color 0.14s ease;
    }

    .filter-chip.active {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    /* 모달 공통 (경량 opacity + transform 전환) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 80;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.18s ease, visibility 0.18s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .modal-box {
      background: #ffffff;
      border: 1.5px solid #222222;
      border-radius: 18px;
      width: 100%;
      max-width: 540px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
      transform: translateY(8px) scale(0.99);
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .modal-backdrop.open .modal-box {
      transform: translateY(0) scale(1);
    }

    /* 식당명 입력 시 실시간 추천 목록 */
    .name-search-wrap {
      position: relative;
    }

    .name-suggest-list {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: #ffffff;
      border: 1.5px solid #222222;
      border-radius: 10px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.12);
      max-height: 210px;
      overflow-y: auto;
      z-index: 30;
      display: none;
    }

    .name-suggest-list.open {
      display: block;
    }

    .name-suggest-item {
      padding: 8px 12px;
      border-bottom: 1px solid #f0f1f4;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 0.86rem;
      transition: background-color 0.12s ease;
    }

    .name-suggest-item:last-child { border-bottom: none; }
    .name-suggest-item:hover { background: var(--soft); }

    .name-suggest-meta {
      font-size: 0.76rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 식당 상세 팝업 */
    .detail-modal-box {
      max-width: 980px;
      padding: 24px 26px;
      position: relative;
    }

    .detail-close-btn {
      position: absolute;
      top: 14px;
      right: 16px;
      border: none;
      background: transparent;
      font-size: 1.2rem;
      padding: 4px 8px;
      z-index: 2;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: minmax(290px, 1.05fr) minmax(280px, 1fr);
      gap: 24px;
      align-items: stretch;
      margin-top: 6px;
    }

    @media (max-width: 780px) {
      .detail-grid {
        grid-template-columns: 1fr;
      }
    }

    .detail-left {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .carousel-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      border: 1px solid #d0d5dd;
      background: #f8f9fb;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .carousel-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .carousel-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 34px;
      height: 34px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #333333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-weight: 700;
      padding: 0;
      z-index: 2;
    }

    .carousel-arrow.prev { left: 10px; }
    .carousel-arrow.next { right: 10px; }

    .carousel-controls-bottom {
      position: absolute;
      bottom: 8px;
      right: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 2;
    }

    .carousel-indicator {
      background: rgba(0, 0, 0, 0.68);
      color: #fff;
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 999px;
    }

    .photo-zoom-link {
      background: rgba(255, 255, 255, 0.94);
      color: #111111;
      border: 1px solid #333333;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      text-decoration: none;
    }

    .detail-title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 2px;
    }

    .detail-title {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 700;
    }

    .like-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: none;
      background: transparent;
      font-size: 1.1rem;
      padding: 4px 8px;
    }

    .like-pill.liked { color: #e11d48; font-weight: 700; }

    .detail-sub-summary {
      font-size: 1rem;
      color: #222222;
      margin-bottom: 4px;
    }

    .detail-kv-list {
      display: grid;
      gap: 6px;
      font-size: 0.96rem;
    }

    .detail-kv {
      display: grid;
      grid-template-columns: 78px 1fr;
      gap: 10px;
      align-items: baseline;
    }

    .detail-k {
      font-weight: 600;
      color: #222222;
    }

    .detail-v {
      word-break: break-word;
    }

    .copyable-address {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 6px;
      margin: -2px -6px;
      border-radius: 7px;
      cursor: pointer;
      transition: background-color 0.14s ease;
    }

    .copyable-address:hover {
      background: var(--soft);
    }

    .copy-icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      padding: 0;
      border: 1px solid var(--line-soft);
      border-radius: 6px;
      background: #ffffff;
      color: #333333;
      flex-shrink: 0;
    }

    .copy-icon-btn.copied {
      border-color: #111111;
      background: #111111;
      color: #ffffff;
    }

    .detail-right {
      border-left: 1px solid #9aa0a6;
      padding-left: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 360px;
    }

    @media (max-width: 780px) {
      .detail-right {
        border-left: none;
        border-top: 1px solid #9aa0a6;
        padding-left: 0;
        padding-top: 16px;
        min-height: auto;
      }
    }

    .detail-top-actions {
      display: flex;
      justify-content: flex-end;
      gap: 14px;
      padding-right: 36px;
      margin-bottom: 10px;
    }

    .action-text-btn {
      border: none;
      background: transparent;
      padding: 2px 4px;
      font-size: 0.95rem;
      font-weight: 500;
      color: #222222;
    }

    .action-text-btn.delete:hover { color: var(--danger); }

    .overflow-meta-box {
      font-size: 0.9rem;
      color: #222222;
      margin-bottom: 14px;
      display: grid;
      gap: 5px;
    }

    .comments-bottom-wrap {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .comments-scroll {
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .comment-bubble {
      padding: 6px 0;
      border-bottom: 1px solid #f0f1f4;
      font-size: 0.94rem;
    }

    .comment-date {
      font-size: 0.72rem;
      color: var(--muted);
      margin-left: 6px;
    }

    .comment-compose {
      display: flex;
      gap: 6px;
      padding-top: 6px;
      border-top: 1px solid #e5e7eb;
    }

    .form-grid {
      display: grid;
      gap: 12px;
    }

    .form-field label {
      display: block;
      font-size: 0.84rem;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .form-field input,
    .form-field select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--line-soft);
      border-radius: 9px;
      font-size: 0.9rem;
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .extra-info-box {
      display: none;
      margin-top: 10px;
      padding: 12px;
      border: 1px dashed #b8bec8;
      border-radius: 12px;
      background: #fafbfc;
      gap: 10px;
    }

    .extra-info-box.has-items {
      display: grid;
    }

    .extra-info-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--muted);
    }

    .existing-cats-preview {
      font-size: 0.8rem;
      color: var(--muted);
      background: var(--soft);
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--line-soft);
    }

    .form-add-col-bar {
      display: flex;
      justify-content: flex-start;
      margin-top: 14px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px;
    }

    .photo-thumb-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .photo-thumb-item {
      position: relative;
      width: 76px;
      height: 76px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--line-soft);
    }

    .photo-thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo-thumb-remove {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 20px;
      height: 20px;
      padding: 0;
      border-radius: 999px;
      font-size: 0.72rem;
      line-height: 1;
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      border: none;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #111111;
      color: #ffffff;
      padding: 10px 15px;
      border-radius: 10px;
      font-size: 0.85rem;
      z-index: 120;
      opacity: 0;
      transform: translateY(6px);
      pointer-events: none;
      transition: opacity 0.16s ease, transform 0.16s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .empty-box {
      grid-column: 1 / -1;
      padding: 36px 20px;
      text-align: center;
      border: 1px dashed var(--line-soft);
      border-radius: var(--radius-card);
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header class="top-header" id="topHeader">
    <div class="header-wrap">
      <h1 class="site-title" onclick="clearAllFilters()"><span class="bold-char">우</span>리는 <span class="bold-char">회</span>식 맛집이 필요<span class="bold-char">해</span></h1>

      <div class="quick-filters" aria-label="상단 바로가기 필터">
        <div class="quick-row" id="topPurposeRow"></div>
        <div class="quick-row" id="topCategoryRow"></div>
        <div class="quick-row" id="topAreaRow"></div>
      </div>

      <div class="header-utils">
        <button type="button" class="nick-badge" onclick="openNicknameModal()">
          닉네임: <strong id="nickDisplay">미설정</strong>
        </button>
      </div>
    </div>
  </header>

  <div class="main-shell">
    <button type="button" class="hamburger-btn" onclick="toggleDrawer()" aria-label="전체 카테고리 메뉴 열기" title="전체 카테고리 보기">
      <span></span>
      <span></span>
      <span></span>
    </button>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    // ★ 배포한 Google Apps Script 웹 앱 URL을 입력하세요.
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwt4c3MYJ5lPMB7V2MKY5YAJKyUYQ8RwpQaXE5x0-jMKfjUyz2Hm6mmIj45eolhxlG6/exec';
    const DELIMITER = ';';
    const DELETE_PHRASE = '이 식당을 삭제하겠습니다.';

   const HEADER_SHORTCUTS = [
  {
    label: '식사목적',
    colKey: 'purpose',
    items: [
      { text: '접대', value: '손님접대' },
      { text: '회식', value: '회식' },
      { text: '식사', value: '식사' }
    ]
  },
  { label: '음식종류', colKey: 'category', items: ['한식', '중식', '일식', '양식'] },
  { label: '식당위치', colKey: 'area', items: ['후문', '정문', '상대', '농대', '전철우사거리', '복개도로'] }
];
    const FIXED_KEYS = new Set([
      'place_id', 'status', 'name', 'address', '주소',
      'area', 'category', 'max_capacity', 'like_count',
      'purpose', 'photo_url', 'parking',
      'kakao_map_url', 'naver_map_url',
      'comments_json', 'created_by', 'updated_info'
    ]);

    const state = {
      nickname: '',
      pendingAction: null,
      places: [],
      columnsMeta: [],
      dynamicPlainColumns: [],
      likesByNickname: {},
      selectedFilters: {},
      activeDetailPlaceId: null,
      detailSlideIdx: 0,
      editingPlaceId: null,
      deletingPlaceId: null,
      existingPhotoUrls: [],
      pendingPhotoUploads: [],
      photoConsentResolver: null,
      optionTarget: null,
      copiedAddressTimer: null
    };

    const formSelected = {
      purpose: new Set(),
      category: new Set(),
      area: new Set(),
      dynamicSelects: {}
    };

    function fromCodes(codes) {
      return codes.map(c => String.fromCharCode(c)).join('');
    }

    function escapeHtml(str) {
      const AMP = fromCodes([38]);
      const LT = fromCodes([60]);
      const GT = fromCodes([62]);
      const QUOT = fromCodes([34]);
      const APOS = fromCodes([39]);
      return String(str ?? '')
        .split(AMP).join(AMP + 'amp;')
        .split(LT).join(AMP + 'lt;')
        .split(GT).join(AMP + 'gt;')
        .split(QUOT).join(AMP + 'quot;')
        .split(APOS).join(AMP + '#39;');
    }

    function escapeAttr(str) {
      const GRAVE = fromCodes([96]);
      const AMP = fromCodes([38]);
      return escapeHtml(str).split(GRAVE).join(AMP + '#96;');
    }

    function splitSemi(val) {
      return String(val || '')
        .split(DELIMITER)
        .map(s => s.trim())
        .filter(Boolean);
    }

    function getPlaceAddress(place) {
      if (!place) return '';
      return String(place.address !== undefined && place.address !== '' ? place.address : (place['주소'] || '')).trim();
    }

    function syncHeaderHeightVar() {
      const header = document.getElementById('topHeader');
      if (header) {
        document.documentElement.style.setProperty('--header-h', header.offsetHeight + 'px');
      }
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
    }

    function openModal(id) {
      const el = document.getElementById(id);
      if (el) el.classList.add('open');
    }

    function closeModal(id) {
      const el = document.getElementById(id);
      if (el) el.classList.remove('open');
      if (id === 'placeFormModal') hideNameSuggestions();
    }

    function toggleDrawer() {
      syncHeaderHeightVar();
      renderDrawerFilters();
      document.getElementById('drawerBackdrop').classList.toggle('open');
    }

    function closeDrawer() {
      document.getElementById('drawerBackdrop').classList.remove('open');
    }

    function readNickname() {
      try { return localStorage.getItem('archive_nickname') || ''; }
      catch (_) { return ''; }
    }

    function saveNickname(val) {
      try { localStorage.setItem('archive_nickname', val); }
      catch (_) {}
    }

    function updateNicknameUI() {
      document.getElementById('nickDisplay').textContent = state.nickname || '미설정';
    }

    function openNicknameModal() {
      document.getElementById('nickInput').value = state.nickname || '';
      openModal('nickModal');
      setTimeout(() => document.getElementById('nickInput').focus(), 40);
    }

    function confirmNickname() {
      const v = document.getElementById('nickInput').value.trim();
      if (!v) {
        showToast('닉네임을 입력하세요.');
        return;
      }
      state.nickname = v;
      saveNickname(v);
      updateNicknameUI();
      closeModal('nickModal');
      renderCards();
      if (state.activeDetailPlaceId) renderDetailModal();
      const fn = state.pendingAction;
      state.pendingAction = null;
      if (typeof fn === 'function') fn();
    }

    function requireNickname(fn) {
      if (state.nickname && state.nickname.trim()) {
        fn();
      } else {
        state.pendingAction = fn;
        openNicknameModal();
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      syncHeaderHeightVar();
      window.addEventListener('resize', syncHeaderHeightVar);
      state.nickname = readNickname();
      updateNicknameUI();
      loadInitialData();
    });

    async function loadInitialData() {
      renderTopQuickFilters();
      renderCards();
      syncHeaderHeightVar();

      if (!SCRIPT_URL || SCRIPT_URL.includes('여기에_배포된')) {
        showToast('SCRIPT_URL 설정 전 기본 화면으로 표시 중입니다.');
        return;
      }

      try {
        const nickParam = state.nickname ? `&nickname=${encodeURIComponent(state.nickname)}` : '';
        const res = await fetch(`${SCRIPT_URL}?action=init${nickParam}`);
        const json = await res.json();
        if (!json.ok) throw new Error(json.error || '데이터 로드 실패');
        applyPayload(json.data);
      } catch (err) {
        console.error(err);
        document.getElementById('cardsGrid').innerHTML =
          `<div class="empty-box">데이터 불러오기 오류: ${escapeHtml(err.message)}</div>`;
      }
    }

    async function postAction(payloadObj) {
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ ...payloadObj, nickname: state.nickname })
      });
      const text = await res.text();
      let json;
      try {
        json = JSON.parse(text);
      } catch (_) {
        throw new Error(text || '응답 파싱 실패');
      }
      if (!json.ok) throw new Error(json.error || '처리 실패');
      if (json.data) applyPayload(json.data);
      return json;
    }

    function applyPayload(data) {
      state.places = Array.isArray(data.places) ? data.places : [];
      state.columnsMeta = Array.isArray(data.columnsMeta) ? data.columnsMeta : [];
      state.dynamicPlainColumns = Array.isArray(data.dynamicPlainColumns) ? data.dynamicPlainColumns : [];
     // applyPayload(data) 내부
state.likedPlaceIds = Array.isArray(data.likedPlaceIds) ? data.likedPlaceIds : [];

      renderTopQuickFilters();
      renderDrawerFilters();
      renderCards();
      renderExistingCategoriesPreview();
      syncHeaderHeightVar();

      const formModal = document.getElementById('placeFormModal');
      if (formModal && formModal.classList.contains('open')) {
        const currentExisting = state.editingPlaceId
          ? state.places.find(p => p.place_id === state.editingPlaceId)
          : null;
        renderChipSelector('f_purpose_chips', 'purpose', ['손님접대', '회식', '식사'], formSelected.purpose);
        renderChipSelector('f_category_chips', 'category', ['한식', '중식', '일식', '양식'], formSelected.category);
        renderChipSelector('f_area_chips', 'area', ['후문', '정문', '상대', '농대', '전철우사거리', '복개도로'], formSelected.area);
        renderExtraCategoryInputs(currentExisting);
      }

      if (state.activeDetailPlaceId) {
        const stillExists = state.places.some(p => p.place_id === state.activeDetailPlaceId);
        if (stillExists) renderDetailModal();
        else {
          state.activeDetailPlaceId = null;
          closeModal('detailModal');
        }
      }
    }

    function getOptions(colKey, fallback) {
      const m = state.columnsMeta.find(x => x.col_key === colKey);
      const fromMeta = (m && Array.isArray(m.options)) ? m.options : [];
      const fromPlaces = state.places.flatMap(p => splitSemi(p[colKey]));
      const merged = Array.from(new Set([...(fallback || []), ...fromMeta, ...fromPlaces]));
      return merged.length ? merged : (fallback || []);
    }

    function ensureFilterSet(colKey) {
      if (!state.selectedFilters[colKey]) state.selectedFilters[colKey] = new Set();
      return state.selectedFilters[colKey];
    }

    function toggleFilterValue(colKey, val) {
      const set = ensureFilterSet(colKey);
      if (set.has(val)) set.delete(val);
      else set.add(val);
      renderTopQuickFilters();
      renderDrawerFilters();
      renderCards();
    }

async function loadProxyImagesIntoDom() {
  const imgs = document.querySelectorAll('img[data-proxy-url]');
  for (const img of imgs) {
    const url = img.getAttribute('data-proxy-url');
    if (!url || img.getAttribute('data-loaded') === '1') continue;
    try {
      const res = await fetch(url);
      const json = await res.json();
      if (json.ok && json.dataUri) {
        img.src = json.dataUri;
        img.setAttribute('data-loaded', '1');
      }
    } catch (_) {}
  }
}

    function clearAllFilters() {
      state.selectedFilters = {};
      document.getElementById('searchInput').value = '';
      renderTopQuickFilters();
      renderDrawerFilters();
      renderCards();
    }

    function renderTopQuickFilters() {
  const rowMap = {
    purpose: 'topPurposeRow',
    category: 'topCategoryRow',
    area: 'topAreaRow'
  };

  HEADER_SHORTCUTS.forEach(sc => {
    const row = document.getElementById(rowMap[sc.colKey]);
    if (!row) return;
    row.innerHTML = '';

    const lbl = document.createElement('span');
    lbl.className = 'quick-label';
    lbl.textContent = sc.label;
    row.appendChild(lbl);

    const activeSet = ensureFilterSet(sc.colKey);
    sc.items.forEach(opt => {
      const displayText = typeof opt === 'object' ? opt.text : opt;
      const filterValue = typeof opt === 'object' ? opt.value : opt;

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'quick-item' + (activeSet.has(filterValue) ? ' active' : '');
      btn.textContent = displayText;
      btn.onclick = () => toggleFilterValue(sc.colKey, filterValue);
      row.appendChild(btn);
    });
  });
}

    function getExtraCategories() {
      const list = [];
      const seen = new Set();

      state.columnsMeta.forEach(m => {
        if (!FIXED_KEYS.has(m.col_key) && !seen.has(m.col_key)) {
          seen.add(m.col_key);
          list.push({
            key: m.col_key,
            inputType: m.input_type || 'text',
            options: m.options || []
          });
        }
      });

      state.dynamicPlainColumns.forEach(k => {
        if (!FIXED_KEYS.has(k) && !seen.has(k)) {
          seen.add(k);
          list.push({
            key: k,
            inputType: 'text',
            options: []
          });
        }
      });

      return list;
    }

    function getAllFilterableColumns() {
      const base = [
        { key: 'purpose', label: '식사목적', fallback: ['손님접대', '회식', '식사'] },
        { key: 'category', label: '음식종류', fallback: ['한식', '중식', '일식', '양식'] },
        { key: 'area', label: '식당위치', fallback: ['후문', '정문', '상대', '농대', '전철우사거리', '복개도로'] }
      ];
      const extras = getExtraCategories().map(x => ({
        key: x.key,
        label: x.key,
        fallback: x.options
      }));
      return base.concat(extras);
    }

    function renderDrawerFilters() {
      const body = document.getElementById('drawerFilterBody');
      body.innerHTML = '';

      const cols = getAllFilterableColumns();
      cols.forEach(col => {
        const valuesSet = new Set(getOptions(col.key, col.fallback));
        state.places.forEach(p => {
          splitSemi(p[col.key]).forEach(v => valuesSet.add(v));
        });
        const allVals = Array.from(valuesSet);
        if (!allVals.length) return;

        const grp = document.createElement('div');
        const title = document.createElement('div');
        title.className = 'drawer-group-title';
        title.textContent = col.label;
        grp.appendChild(title);

        const chipsWrap = document.createElement('div');
        chipsWrap.className = 'drawer-chips';
        const activeSet = ensureFilterSet(col.key);

        allVals.forEach(val => {
          const chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'filter-chip' + (activeSet.has(val) ? ' active' : '');
          chip.textContent = val;
          chip.onclick = () => toggleFilterValue(col.key, val);
          chipsWrap.appendChild(chip);
        });

        grp.appendChild(chipsWrap);
        body.appendChild(grp);
      });
    }

    function getFilteredPlaces() {
      const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
      const sortBy = document.getElementById('sortSelect').value;

      const list = state.places.filter(p => {
        for (const [colKey, selSet] of Object.entries(state.selectedFilters)) {
          if (!selSet || selSet.size === 0) continue;
          const itemVals = splitSemi(p[colKey]);
          const matched = itemVals.some(v => selSet.has(v));
          if (!matched) return false;
        }

        if (q) {
          const allText = [
            p.name, p.purpose, p.category, p.area,
            p.max_capacity, p.parking, getPlaceAddress(p),
            ...getAllFilterableColumns().map(c => p[c.key] || '')
          ].join(' ').toLowerCase();
          if (!allText.includes(q)) return false;
        }
        return true;
      });

      if (sortBy === 'name') {
        list.sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'ko'));
      } else {
        list.sort((a, b) => (Number(b.like_count) || 0) - (Number(a.like_count) || 0));
      }
      return list;
    }

    function renderActiveFilterSummary() {
      const bar = document.getElementById('activeFilterBar');
      const activePairs = [];
      for (const [k, s] of Object.entries(state.selectedFilters)) {
        s.forEach(v => activePairs.push({ k, v }));
      }

      if (!activePairs.length) {
        bar.innerHTML = '<span>전체 식당 보기</span>';
        return;
      }

      bar.innerHTML = '<span>적용 필터:</span>' + activePairs.map(item =>
        `<span class="active-tag" onclick="toggleFilterValue('${escapeAttr(item.k)}', '${escapeAttr(item.v)}')">${escapeHtml(item.v)} ✕</span>`
      ).join('') + `<button type="button" class="sm" onclick="clearAllFilters()">전체 해제</button>`;
    }

    function renderCards() {
      renderActiveFilterSummary();
      const grid = document.getElementById('cardsGrid');
      const list = getFilteredPlaces();

      const addCardHtml = `
        <div class="add-tile" onclick="openPlaceFormModal()" title="식당 추가" aria-label="식당 추가">+</div>

    // 3. 상세 보기: 주소 클릭/터치 복사 및 아이콘 표시
    function copyAddressText(addrText, btnEl) {
      if (!addrText) return;
      const done = () => {
        showToast('주소가 복사되었습니다.');
        if (btnEl) {
          btnEl.classList.add('copied');
          clearTimeout(state.copiedAddressTimer);
          state.copiedAddressTimer = setTimeout(() => {
            btnEl.classList.remove('copied');
          }, 1400);
        }
      };

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(addrText).then(done).catch(() => fallbackCopy(addrText, done));
      } else {
        fallbackCopy(addrText, done);
      }
    }

    function fallbackCopy(text, onDone) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        onDone();
      } catch (_) {
        showToast('복사에 실패했습니다.');
      } finally {
        document.body.removeChild(ta);
      }
    }

    function openDetailModal(placeId) {
      state.activeDetailPlaceId = placeId;
      state.detailSlideIdx = 0;
      renderDetailModal();
      openModal('detailModal');
    }

    function stepDetailSlide(delta) {
      const place = state.places.find(p => p.place_id === state.activeDetailPlaceId);
      if (!place) return;
      const proxyUrls = Array.isArray(place.photo_proxy_urls) ? place.photo_proxy_urls : [];
      if (proxyUrls.length <= 1) return;
      state.detailSlideIdx = (state.detailSlideIdx + delta + proxyUrls.length) % proxyUrls.length;
      renderDetailModal();
    }

    function renderDetailModal() {
      const place = state.places.find(p => p.place_id === state.activeDetailPlaceId);
      const wrap = document.getElementById('detailModalContent');
      if (!place) return;

      const proxyUrls = Array.isArray(place.photo_proxy_urls) ? place.photo_proxy_urls : [];
      const totalPhotos = Number(place.photo_count) || proxyUrls.length;
      const idx = Math.min(state.detailSlideIdx, Math.max(0, proxyUrls.length - 1));
      state.detailSlideIdx = idx;
      const currentProxyUrl = proxyUrls[idx] || '';

      const likedList = Array.isArray(state.likedPlaceIds) ? state.likedPlaceIds : [];
      const myLiked = likedList.includes(place.place_id);

      const summaryText = [
        ...splitSemi(place.purpose),
        ...splitSemi(place.area),
        ...splitSemi(place.category)
      ].join(' · ') || '-';

      const zoomHref = currentProxyUrl ? `${currentProxyUrl}&mode=view` : '#';

      const photoVisualHtml = currentProxyUrl
        ? `<img src="" alt="${escapeAttr(place.name)}" data-proxy-url="${escapeAttr(currentProxyUrl)}" data-loaded="0" />
           ${proxyUrls.length > 1
             ? `<button type="button" class="carousel-arrow prev" onclick="event.stopPropagation();stepDetailSlide(-1)" aria-label="이전 사진"><</button>
                <button type="button" class="carousel-arrow next" onclick="event.stopPropagation();stepDetailSlide(1)" aria-label="다음 사진">></button>`
             : ''}
           <div class="carousel-controls-bottom" onclick="event.stopPropagation()">
             ${totalPhotos > 1 ? `<span class="carousel-indicator">${idx + 1} / ${totalPhotos}</span>` : ''}
             <a class="photo-zoom-link" href="${escapeAttr(zoomHref)}" target="_blank" rel="noopener noreferrer">사진 원본 보기 ↗</a>
           </div>`
        : `<span style="color:var(--muted);">(이미지)</span>`;

      const addressText = getPlaceAddress(place);
      const copySvg = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;

      const addressRowHtml = addressText
        ? `<div class="detail-kv">
             <span class="detail-k">주소</span>
             <span class="detail-v">
               <span class="copyable-address" onclick="copyAddressText('${escapeAttr(addressText)}', this.querySelector('.copy-icon-btn'))" title="클릭하여 주소 복사">
                 <span>${escapeHtml(addressText)}</span>
                 <button type="button" class="copy-icon-btn" aria-label="주소 복사" onclick="event.stopPropagation();copyAddressText('${escapeAttr(addressText)}', this)">${copySvg}</button>
               </span>
             </span>
           </div>`
        : '';

      const extraKeys = getExtraCategories().map(x => x.key);

      const filledExtra = extraKeys
        .map(k => ({ key: k, val: String(place[k] || '').trim() }))
        .filter(x => x.val);

      const leftExtra = filledExtra.slice(0, 2);
      const rightOverflowExtra = filledExtra.slice(2);

      const mapLinksHtml = [
        place.kakao_map_url ? `<a href="${escapeAttr(place.kakao_map_url)}" target="_blank" rel="noopener noreferrer">카카오맵</a>` : '',
        place.naver_map_url ? `<a href="${escapeAttr(place.naver_map_url)}" target="_blank" rel="noopener noreferrer">네이버지도</a>` : ''
      ].filter(Boolean).join(' · ');

      const leftKvHtml = [
        place.max_capacity ? `<div class="detail-kv"><span class="detail-k">인원</span><span class="detail-v">${escapeHtml(place.max_capacity)}</span></div>` : '',
        addressRowHtml,
        place.parking ? `<div class="detail-kv"><span class="detail-k">주차</span><span class="detail-v">${escapeHtml(place.parking)}</span></div>` : '',
        mapLinksHtml ? `<div class="detail-kv"><span class="detail-k">지도</span><span class="detail-v">${mapLinksHtml}</span></div>` : '',
        ...leftExtra.map(x => `<div class="detail-kv"><span class="detail-k">${escapeHtml(x.key)}</span><span class="detail-v">${escapeHtml(x.val)}</span></div>`)
      ].filter(Boolean).join('');

      const rightOverflowHtml = rightOverflowExtra.length
        ? `<div class="overflow-meta-box">${
            rightOverflowExtra.map(x => `<div><strong>${escapeHtml(x.key)}:</strong> ${escapeHtml(x.val)}</div>`).join('')
          }</div>`
        : '';

      const comments = Array.isArray(place.comments) ? place.comments : [];
      const commentsHtml = comments.length
        ? comments.map(c => `
            <div class="comment-bubble">
              <span>${escapeHtml(c.text || '')}</span>
              <span class="comment-date">${escapeHtml(c.created_at || '')}</span>
            </div>
          `).join('')
        : '<div style="font-size:0.84rem; color:var(--muted);">등록된 댓글이 없습니다.</div>';

      wrap.innerHTML = `
        <div class="detail-left">
          <div class="carousel-box">${photoVisualHtml}</div>
          <div class="detail-title-bar">
            <h2 class="detail-title">${escapeHtml(place.name || '식당이름')}</h2>
            <button type="button" class="like-pill ${myLiked ? 'liked' : ''}" onclick="onToggleLike('${escapeAttr(place.place_id)}')">
              ${myLiked ? '♥' : '♡'} <span>${Number(place.like_count) || 0}</span>
            </button>
          </div>
          <div class="detail-sub-summary">${escapeHtml(summaryText)}</div>
          <div class="detail-kv-list">${leftKvHtml}</div>
        </div>

        <div class="detail-right">
          <div>
            <div class="detail-top-actions">
              <button type="button" class="action-text-btn" onclick="onEditPlace('${escapeAttr(place.place_id)}')">수정</button>
              <button type="button" class="action-text-btn delete" onclick="onTrashPlace('${escapeAttr(place.place_id)}')">삭제</button>
            </div>
            ${rightOverflowHtml}
          </div>

          <div class="comments-bottom-wrap">
            <div class="comments-scroll">${commentsHtml}</div>
            <div class="comment-compose">
              <input type="text" id="detailCommentInput" placeholder="댓글 남기기 (닉네임 비공개)" style="flex:1; padding:7px 10px; border:1px solid var(--line-soft); border-radius:8px; font-size:0.86rem;" onkeydown="if(event.key==='Enter'){event.preventDefault();onSubmitDetailComment('${escapeAttr(place.place_id)}');}" />
              <button type="button" class="sm primary" onclick="onSubmitDetailComment('${escapeAttr(place.place_id)}')">등록</button>
            </div>
          </div>
        </div>
      `;
      loadProxyImagesIntoDom();
    }

    function onToggleLike(placeId) {
      requireNickname(async () => {
        try {
          await postAction({ action: 'toggleLike', place_id: placeId });
          showToast('좋아요가 반영되었습니다.');
        } catch (err) {
          showToast(err.message);
        }
      });
    }

    function onSubmitDetailComment(placeId) {
      const inp = document.getElementById('detailCommentInput');
      const text = (inp ? inp.value : '').trim();
      if (!text) {
        showToast('댓글을 입력하세요.');
        return;
      }
      requireNickname(async () => {
        try {
          await postAction({ action: 'addComment', place_id: placeId, text });
          if (inp) inp.value = '';
          showToast('댓글이 등록되었습니다.');
        } catch (err) {
          showToast(err.message);
        }
      });
    }

    function onEditPlace(placeId) {
      requireNickname(() => {
        closeModal('detailModal');
        openPlaceFormModal(placeId);
      });
    }

    function onTrashPlace(placeId) {
      requireNickname(() => {
        const target = state.places.find(p => p.place_id === placeId);
        state.deletingPlaceId = placeId;
        document.getElementById('deleteTargetName').textContent = target ? target.name : placeId;
        document.getElementById('deleteConfirmInput').value = '';
        openModal('deleteModal');
      });
    }

    async function submitTrashPlace() {
      const phrase = document.getElementById('deleteConfirmInput').value.trim();
      if (phrase !== DELETE_PHRASE) {
        showToast(`"${DELETE_PHRASE}" 문구를 정확히 입력하세요.`);
        return;
      }
      try {
        await postAction({
          action: 'trashPlace',
          place_id: state.deletingPlaceId,
          confirm_text: phrase
        });
        closeModal('deleteModal');
        closeModal('detailModal');
        state.activeDetailPlaceId = null;
        showToast('휴지통 처리되었습니다.');
      } catch (err) {
        showToast(err.message);
      }
    }

    // 2. 식당 추가 시 식당명 문자열 검색 및 추천 목록 선택
    function hideNameSuggestions() {
      const box = document.getElementById('nameSuggestList');
      if (box) box.classList.remove('open');
    }

    function onNameInputChange() {
      if (state.editingPlaceId) {
        hideNameSuggestions();
        return;
      }
      const q = (document.getElementById('f_name').value || '').trim().toLowerCase();
      const box = document.getElementById('nameSuggestList');
      if (!box) return;

      if (!q) {
        box.innerHTML = '';
        box.classList.remove('open');
        return;
      }

      const matches = state.places
        .filter(p => String(p.name || '').toLowerCase().includes(q))
        .slice(0, 8);

      if (!matches.length) {
        box.innerHTML = '';
        box.classList.remove('open');
        return;
      }

      box.innerHTML = matches.map(m => {
        const meta = [splitSemi(m.area).join(','), splitSemi(m.category).join(',')].filter(Boolean).join(' · ');
        return `
          <div class="name-suggest-item" onclick="applySuggestedPlace('${escapeAttr(m.place_id)}')">
            <strong>${escapeHtml(m.name)}</strong>
            <span class="name-suggest-meta">${escapeHtml(meta || getPlaceAddress(m) || '기존 식당')}</span>
          </div>
        `;
      }).join('');
      box.classList.add('open');
    }

    function applySuggestedPlace(placeId) {
      const src = state.places.find(p => p.place_id === placeId);
      if (!src) return;

      document.getElementById('f_name').value = src.name || '';
      document.getElementById('f_max_capacity').value = src.max_capacity || '';
      document.getElementById('f_address').value = getPlaceAddress(src);
      document.getElementById('f_parking').value = src.parking || '';
      document.getElementById('f_kakao_map_url').value = src.kakao_map_url || '';
      document.getElementById('f_naver_map_url').value = src.naver_map_url || '';

      formSelected.purpose = new Set(splitSemi(src.purpose));
      formSelected.category = new Set(splitSemi(src.category));
      formSelected.area = new Set(splitSemi(src.area));

      renderChipSelector('f_purpose_chips', 'purpose', ['손님접대', '회식', '식사'], formSelected.purpose);
      renderChipSelector('f_category_chips', 'category', ['한식', '중식', '일식', '양식'], formSelected.category);
      renderChipSelector('f_area_chips', 'area', ['후문', '정문', '상대', '농대', '전철우사거리', '복개도로'], formSelected.area);

      hideNameSuggestions();
      showToast(`"${src.name}" 정보를 불러왔습니다.`);
    }

    function openPlaceFormModal(placeId = null) {
      if (!placeId && !state.nickname) {
        requireNickname(() => openPlaceFormModal(null));
        return;
      }

      state.editingPlaceId = placeId;
      state.pendingPhotoUploads = [];
      document.getElementById('f_photo_files').value = '';
      hideNameSuggestions();

      const existing = placeId ? state.places.find(p => p.place_id === placeId) : null;
      document.getElementById('placeFormTitle').textContent = existing ? `식당 수정 (${existing.name})` : '식당 추가';

      document.getElementById('f_name').value = existing ? (existing.name || '') : '';
      document.getElementById('f_max_capacity').value = existing ? (existing.max_capacity || '') : '';
      document.getElementById('f_address').value = existing ? getPlaceAddress(existing) : '';
      document.getElementById('f_parking').value = existing ? (existing.parking || '') : '';
      document.getElementById('f_kakao_map_url').value = existing ? (existing.kakao_map_url || '') : '';
      document.getElementById('f_naver_map_url').value = existing ? (existing.naver_map_url || '') : '';

      state.existingPhotoUrls = existing ? splitSemi(existing.photo_url) : [];
      renderPhotoThumbStrip();

      formSelected.purpose = new Set(existing ? splitSemi(existing.purpose) : []);
      formSelected.category = new Set(existing ? splitSemi(existing.category) : []);
      formSelected.area = new Set(existing ? splitSemi(existing.area) : []);
      formSelected.dynamicSelects = {};

      renderChipSelector('f_purpose_chips', 'purpose', ['손님접대', '회식', '식사'], formSelected.purpose);
      renderChipSelector('f_category_chips', 'category', ['한식', '중식', '일식', '양식'], formSelected.category);
      renderChipSelector('f_area_chips', 'area', ['후문', '정문', '상대', '농대', '전철우사거리', '복개도로'], formSelected.area);

      renderExtraCategoryInputs(existing);
      openModal('placeFormModal');
    }

    // 1. '+ 옵션 추가' 팝업 모달 오픈 및 저장
    function openAddOptionModal(colKey, fallback, selSet, chipContainerId) {
      requireNickname(() => {
        state.optionTarget = { colKey, fallback, selSet, chipContainerId };
        document.getElementById('addOptionModalTitle').textContent = '새 옵션 추가';
        document.getElementById('addOptionModalDesc').textContent = `"${colKey}" 항목에 추가할 새 선택지를 입력하세요.`;
        document.getElementById('newOptionInput').value = '';
        openModal('addOptionModal');
        setTimeout(() => document.getElementById('newOptionInput').focus(), 40);
      });
    }

    async function submitAddOptionModal() {
      const target = state.optionTarget;
      if (!target) return;

      const raw = (document.getElementById('newOptionInput').value || '').trim();
      if (!raw) {
        showToast('추가할 선택지 이름을 입력하세요.');
        return;
      }
      const clean = raw.replace(/;/g, '/').trim();

      const submitBtn = document.getElementById('addOptionSubmitBtn');
      if (submitBtn) submitBtn.disabled = true;

      try {
        await postAction({ action: 'addOption', col_key: target.colKey, option: clean });
        target.selSet.add(clean);
        renderChipSelector(target.chipContainerId, target.colKey, target.fallback, target.selSet);
        closeModal('addOptionModal');
        state.optionTarget = null;
        showToast(`"${clean}" 옵션이 추가되었습니다.`);
      } catch (err) {
        showToast(err.message);
      } finally {
        if (submitBtn) submitBtn.disabled = false;
      }
    }

    function renderChipSelector(elId, colKey, fallback, selSet) {
      const box = document.getElementById(elId);
      box.innerHTML = '';
      const opts = getOptions(colKey, fallback);

      opts.forEach(opt => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'filter-chip' + (selSet.has(opt) ? ' active' : '');
        b.textContent = opt;
        b.onclick = () => {
          if (selSet.has(opt)) selSet.delete(opt);
          else selSet.add(opt);
          renderChipSelector(elId, colKey, fallback, selSet);
        };
        box.appendChild(b);
      });

      const addBtn = document.createElement('button');
      addBtn.type = 'button';
      addBtn.className = 'filter-chip';
      addBtn.style.borderStyle = 'dashed';
      addBtn.textContent = '+ 옵션 추가';
      addBtn.onclick = () => openAddOptionModal(colKey, fallback, selSet, elId);
      box.appendChild(addBtn);
    }

    function renderExtraCategoryInputs(existing) {
      const wrap = document.getElementById('dynamicFieldsContainer');
      if (!wrap) return;

      const draftValues = {};
      wrap.querySelectorAll('[id^="dyn_inp_"]').forEach(inp => {
        draftValues[inp.id.replace('dyn_inp_', '')] = inp.value;
      });

      wrap.innerHTML = '';
      const extras = getExtraCategories();

      if (!extras.length) {
        wrap.classList.remove('has-items');
        return;
      }

      wrap.classList.add('has-items');
      const secTitle = document.createElement('div');
      secTitle.className = 'extra-info-title';
      secTitle.textContent = '기타 정보 (추가된 카테고리)';
      wrap.appendChild(secTitle);

      extras.forEach(cat => {
        const grp = document.createElement('div');
        grp.className = 'form-field';
        const lbl = document.createElement('label');
        lbl.textContent = cat.key;
        grp.appendChild(lbl);

        if (cat.inputType === 'select') {
          const prevSet = formSelected.dynamicSelects[cat.key];
          const s = prevSet ? new Set(prevSet) : new Set(existing ? splitSemi(existing[cat.key]) : []);
          formSelected.dynamicSelects[cat.key] = s;
          const row = document.createElement('div');
          row.className = 'chip-row';
          const rowId = `dyn_chips_${cat.key}`;
          row.id = rowId;
          grp.appendChild(row);
          wrap.appendChild(grp);
          renderChipSelector(rowId, cat.key, cat.options || [], s);
        } else {
          const inp = document.createElement('input');
          inp.type = 'text';
          inp.id = `dyn_inp_${cat.key}`;
          inp.value = draftValues[cat.key] !== undefined
            ? draftValues[cat.key]
            : (existing ? (existing[cat.key] || '') : '');
          grp.appendChild(inp);
          wrap.appendChild(grp);
        }
      });
    }

    function readAndResizePhoto(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            const maxW = 1000;
            let w = img.width;
            let h = img.height;
            if (w > maxW) {
              h = Math.round((h * maxW) / w);
              w = maxW;
            }
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);

            const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
            resolve({
              base64Data: dataUrl.split(',')[1],
              mimeType: 'image/jpeg',
              previewUrl: dataUrl,
              name: file.name
            });
          };
          img.onerror = () => reject(new Error('이미지 로드 실패'));
          img.src = e.target.result;
        };
        reader.onerror = () => reject(new Error('파일 읽기 실패'));
        reader.readAsDataURL(file);
      });
    }

    async function handleMultiPhotoChange(ev) {
      const files = Array.from((ev.target && ev.target.files) || []);
      if (!files.length) return;

      for (const file of files) {
        try {
          const item = await readAndResizePhoto(file);
          state.pendingPhotoUploads.push(item);
        } catch (err) {
          showToast(err.message);
        }
      }
      renderPhotoThumbStrip();
      ev.target.value = '';
    }

    function removeExistingPhoto(idx) {
      state.existingPhotoUrls.splice(idx, 1);
      renderPhotoThumbStrip();
    }

    function removePendingPhoto(idx) {
      state.pendingPhotoUploads.splice(idx, 1);
      renderPhotoThumbStrip();
    }

    function renderPhotoThumbStrip() {
      const strip = document.getElementById('photoThumbStrip');
      const existingHtml = state.existingPhotoUrls.map((url, idx) => `
        <div class="photo-thumb-item">
          <img src="${escapeAttr(url)}" alt="기존 사진" />
          <button type="button" class="photo-thumb-remove" onclick="removeExistingPhoto(${idx})" title="제거">✕</button>
        </div>
      `).join('');

      const pendingHtml = state.pendingPhotoUploads.map((item, idx) => `
        <div class="photo-thumb-item">
          <img src="${escapeAttr(item.previewUrl)}" alt="업로드 예정" />
          <button type="button" class="photo-thumb-remove" onclick="removePendingPhoto(${idx})" title="제거">✕</button>
        </div>
      `).join('');

      strip.innerHTML = existingHtml + pendingHtml;
    }

    function askPhotoUploadConsent() {
      return new Promise(resolve => {
        state.photoConsentResolver = resolve;
        openModal('photoConsentModal');
      });
    }

    function resolvePhotoConsent(agreed) {
      closeModal('photoConsentModal');
      if (!agreed) {
        state.pendingPhotoUploads = [];
        document.getElementById('f_photo_files').value = '';
        renderPhotoThumbStrip();
      }
      const fn = state.photoConsentResolver;
      state.photoConsentResolver = null;
      if (typeof fn === 'function') fn(agreed);
    }

    async function uploadSinglePhotoToDrive(item, placeId) {
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'uploadPhotoOnly',
          place_id: placeId || 'NEW',
          nickname: state.nickname,
          photoUpload: {
            base64Data: item.base64Data,
            mimeType: item.mimeType,
            fileName: item.name
          }
        })
      });
      const text = await res.text();
      let json;
      try {
        json = JSON.parse(text);
      } catch (_) {
        throw new Error(text || '사진 업로드 응답 파싱 실패');
      }
      if (!json.ok) throw new Error(json.error || '사진 업로드 실패');
      const r = json.result || json.data || {};
      return r.imageUrl || r.photoUrl || r.url || '';
    }

    async function submitPlaceForm(ev) {
      ev.preventDefault();
      hideNameSuggestions();

      if (state.pendingPhotoUploads.length > 0) {
        const ok = await askPhotoUploadConsent();
        if (!ok) {
          showToast('사진 업로드가 취소되었습니다.');
          return;
        }
      }

      const btn = document.getElementById('savePlaceBtn');
      btn.disabled = true;

      try {
        const uploadedUrls = [];
        const targetId = state.editingPlaceId || 'NEW';

        for (let i = 0; i < state.pendingPhotoUploads.length; i++) {
          const item = state.pendingPhotoUploads[i];
          const url = await uploadSinglePhotoToDrive(item, targetId);
          if (url) uploadedUrls.push(url);
        }

        const mergedPhotoUrl = state.existingPhotoUrls.concat(uploadedUrls).join(DELIMITER);
        const addrValue = (document.getElementById('f_address').value || '').trim();

        const dynamicFields = {};
        Object.keys(formSelected.dynamicSelects).forEach(k => {
          dynamicFields[k] = Array.from(formSelected.dynamicSelects[k]).join(DELIMITER);
        });
        document.querySelectorAll('[id^="dyn_inp_"]').forEach(inp => {
          const k = inp.id.replace('dyn_inp_', '');
          dynamicFields[k] = inp.value.trim();
        });

        const placePayload = {
          name: document.getElementById('f_name').value.trim(),
          address: addrValue,
          purpose: Array.from(formSelected.purpose).join(DELIMITER),
          category: Array.from(formSelected.category).join(DELIMITER),
          area: Array.from(formSelected.area).join(DELIMITER),
          max_capacity: document.getElementById('f_max_capacity').value.trim(),
          parking: document.getElementById('f_parking').value.trim(),
          kakao_map_url: document.getElementById('f_kakao_map_url').value.trim(),
          naver_map_url: document.getElementById('f_naver_map_url').value.trim(),
          photo_url: mergedPhotoUrl,
          dynamicFields
        };

        if (state.editingPlaceId) {
          await postAction({
            action: 'updatePlace',
            place_id: state.editingPlaceId,
            place: placePayload
          });
          showToast('식당 정보가 수정되었습니다.');
        } else {
          await postAction({
            action: 'addPlace',
            place: placePayload
          });
          showToast('새 식당이 추가되었습니다.');
        }

        closeModal('placeFormModal');
      } catch (err) {
        showToast(err.message);
      } finally {
        btn.disabled = false;
      }
    }

    function renderExistingCategoriesPreview() {
      const box = document.getElementById('existingCategoriesList');
      if (!box) return;
      const extras = getExtraCategories().map(x => x.key);
      if (!extras.length) {
        box.textContent = '현재 추가된 카테고리: 없음';
      } else {
        box.textContent = '현재 추가된 카테고리: ' + extras.join(', ');
      }
    }

    function openAddColumnModal() {
      requireNickname(() => {
        renderExistingCategoriesPreview();
        document.getElementById('newColName').value = '';
        document.getElementById('newColType').value = 'text';
        document.getElementById('newColOpts').value = '';
        toggleNewColOpts();
        openModal('addColumnModal');
        setTimeout(() => document.getElementById('newColName').focus(), 40);
      });
    }

    function toggleNewColOpts() {
      const t = document.getElementById('newColType').value;
      document.getElementById('newColOptsBox').style.display = t === 'select' ? 'block' : 'none';
    }

    async function submitAddColumn() {
      const raw = document.getElementById('newColName').value.trim();
      const inputType = document.getElementById('newColType').value;
      const options = document.getElementById('newColOpts').value.trim();
      if (!raw) {
        showToast('새 카테고리 이름을 입력하세요.');
        return;
      }
      const key = raw.replace(/;/g, '').replace(/\s+/g, '_');

      const submitBtn = document.getElementById('addColSubmitBtn');
      if (submitBtn) submitBtn.disabled = true;

      try {
        await postAction({ action: 'addColumn', col_key: key, input_type: inputType, options });

        if (inputType === 'select') {
          if (!state.columnsMeta.some(m => m.col_key === key)) {
            state.columnsMeta.push({
              col_key: key,
              input_type: 'select',
              options: options ? options.split(DELIMITER).map(s => s.trim()).filter(Boolean) : []
            });
          }
        } else if (!state.dynamicPlainColumns.includes(key)) {
          state.dynamicPlainColumns.push(key);
        }

        const currentExisting = state.editingPlaceId
          ? state.places.find(p => p.place_id === state.editingPlaceId)
          : null;
        renderExtraCategoryInputs(currentExisting);
        renderExistingCategoriesPreview();
        renderDrawerFilters();

        closeModal('addColumnModal');
        showToast(`"${key}" 카테고리가 추가되었습니다.`);
      } catch (err) {
        showToast(err.message);
      } finally {
        if (submitBtn) submitBtn.disabled = false;
      }
    }
  </script>
